services:
  db:
    image: postgres:15-alpine
    container_name: beethinking_db
    environment:
      POSTGRES_USER: beethinking
      POSTGRES_PASSWORD: beethinking
      POSTGRES_DB: beethinking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beethinking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: beethinking_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://beethinking:beethinking@db:5432/beethinking
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: beethinking
      MINIO_SECRET_KEY: beethinking-minio-password
      MINIO_BUCKET: beethinking-photos
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: beethinking_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: beethinking
      MINIO_ROOT_PASSWORD: beethinking-minio-password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_data:
  minio_data:
