<div class="inspect-page">
  <header>
    <p class="eyebrow">Mobile Durchsicht</p>
    <h1>Volk prüfen</h1>
  </header>

  @if (errorMessage()) {
    <div class="alert">{{ errorMessage() }}</div>
  }
  @if (draftMessage()) {
    <div class="sync-state" [class.offline]="!isOnline()">{{ draftMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="save()">
    <label>Datum <input type="date" formControlName="date" /></label>
    <label class="toggle"><input type="checkbox" formControlName="queen_seen" /> Königin gesehen</label>

    <div class="control-grid">
      <label>Futter <input type="number" min="1" max="10" formControlName="food_stores" /></label>
      <label>Varroa <input type="number" min="0" step="0.1" formControlName="varroa_count" /></label>
    </div>

    <label>Schwarmzellen
      <select formControlName="swarm_cells">
        <option value="none">Keine</option>
        <option value="play_cups">Spielnäpfchen</option>
        <option value="queen_cells">Weiselzellen</option>
      </select>
    </label>

    <div class="segmented">
      <label><input type="radio" value="weak" formControlName="strength" /> Schwach</label>
      <label><input type="radio" value="medium" formControlName="strength" /> Mittel</label>
      <label><input type="radio" value="strong" formControlName="strength" /> Stark</label>
    </div>

    <label>Wetter <input formControlName="weather" /></label>
    <label>Nächste Schritte <textarea formControlName="next_steps"></textarea></label>
    <label>Notizen <textarea formControlName="notes"></textarea></label>

    <button type="submit" [disabled]="saving()">{{ isOnline() ? 'Speichern' : 'Entwurf behalten' }}</button>
  </form>
</div>
