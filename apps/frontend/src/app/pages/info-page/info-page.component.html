<div class="info-page">
  <header class="info-hero">
    <p class="eyebrow">{{ page().eyebrow }}</p>
    <h1>{{ page().title }}</h1>
    <p>{{ page().lead }}</p>
    @if (page().ctaLabel && page().ctaLink) {
      <a class="hero-action" [routerLink]="page().ctaLink">{{ page().ctaLabel }}</a>
    }
  </header>

  <section class="info-grid" [attr.aria-label]="page().title">
    @for (section of page().sections; track section.heading) {
      <article class="info-section">
        <h2>{{ section.heading }}</h2>
        <p>{{ section.body }}</p>
      </article>
    }
  </section>
</div>
