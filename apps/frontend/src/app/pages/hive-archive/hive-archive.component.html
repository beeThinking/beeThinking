<div class="archive-page">
  <header class="archive-header">
    <div>
      <a routerLink="/beehives" class="back-link">Zurück</a>
      <h1>Völkerarchiv</h1>
    </div>
  </header>

  <section class="archive-list">
    @for (hive of grouped(); track hive.id) {
      <a class="archive-row" [routerLink]="['/beehives', hive.id]">
        <div>
          <strong>{{ hive.name }}</strong>
          <small>{{ statusLabel(hive.status) }} · {{ hive.archived_at || 'ohne Archivdatum' }}</small>
        </div>
        @if (hive.merged_into_hive_id) {
          <span>vereinigt mit #{{ hive.merged_into_hive_id }}</span>
        }
      </a>
    } @empty {
      <div class="empty-panel">Noch keine archivierten Völker.</div>
    }
  </section>
</div>
