version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: beethinking_db
    environment:
      POSTGRES_USER: beethinking
      POSTGRES_PASSWORD: beethinking
      POSTGRES_DB: beethinking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beethinking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./apps/backend
    container_name: beethinking_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql://beethinking:beethinking@db:5432/beethinking
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./apps/frontend
    container_name: beethinking_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
